name: Deploy ORBITAL COMMAND to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate Supabase Actions secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL" || { echo "::error::Add the repository secret SUPABASE_URL."; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Add the repository secret SUPABASE_PUBLISHABLE_KEY."; exit 1; }
      - name: Deploy ORBITAL DEVELOPERS Edge Function when authorized
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ORBITAL_APP_URL: https://wadycs-dev.github.io/ORBITAL-GAMES-COMIC
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Set SUPABASE_ACCESS_TOKEN to deploy orbital-gamification; the Developers API is not deployed by this run."
            exit 0
          fi
          project_ref="${SUPABASE_URL#https://}"
          project_ref="${project_ref%.supabase.co}"
          npx --yes supabase@2 secrets set "ORBITAL_APP_URL=$ORBITAL_APP_URL" --project-ref "$project_ref" --yes
          npx --yes supabase@2 functions deploy orbital-gamification --project-ref "$project_ref" --yes
      - name: Refresh public NASA data and keyed datasets when available
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: node scripts/update-nasa-snapshots.mjs
      - name: Build site
        env:
          VITE_NASA_MODE: snapshot
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build
      - name: Test mission systems
        run: npm test
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
